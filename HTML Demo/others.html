    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Examples</title>
</head>
<body>

    <section>
        <h1>IFRAME Demonstration</h1>
        <fieldset>
            <legend>Iframe Examples</legend>
            <iframe src="pp.html" width="100%" height="300"></iframe>
            <iframe src="https://en.wikipedia.org" width="100%" height="300"></iframe>
        </fieldset>
    </section>

    <section>
        <h1>Image Map Demonstration</h1>
        <fieldset>
            <legend>Map and Area Example</legend>
            <img src="medium.jpg" usemap="#image-map" width="400" height="200">
            <map name="image-map">
                <area target="_blank" alt="Deepseek" title="Deepseek" href="https://chat.deepseek.com" coords="25,54,200,150">
                <area target="_blank" alt="Notion" title="Notion" href="https://www.notion.so" coords="300,54,500,150">
            </map>
        </fieldset>
    </section>

</body>
</html>

</body>
