<!DOCTYPE html>
<html>
<head>
	<meta >
	<title>Student's details Form Demo</title>
</head>
<body>
	<form>
		<fieldset>
			<legend>Student's details</legend>

			<label for="first_name">First Name</label>
			<input type="text" id="first_name">

			<label for="last_name">Last Name</label>
			<input type="text" id="last_name"></br></br>
			
			<label for="year">Selecy current year of study </label>
			<select id="year">
				<option>1st Year</option>
				<option>2nd Year</option>
				<option>3rd Year</option>
				<option selected>4th Year</option>
			<select>
			</br>

			<label for="gender">Gender </label>
			<input type="radio" id="male" name="gender">
			<label for="male">Male </label>
			<input type="radio" id="female" name="gender">
			<label for="female">Female </label>
			</br>

			<label for="hobbies">Hobby </label>
			<input type="checkbox" id="cricket" name="hobbies">
			<label for="cricket">Cricket </label>
			<input type="checkbox" id="music" name="hobbies">
			<label for="music">Music </label>
			</br>

			<label for="en_no">Enrollment number </label>
			<input type="number" id="en_no" name="enrollment number"></br></br>
			
			<label for="text_area">Address </label>
			<textarea rows="5" cols="25"></textarea>

</br>
			<label for="numbers">Select Number </label>
			<input list="numbers" id="number">
			<datalist id="numbers">
				<option value="One">1</option>
				<option value="One">2</option>
				<option value="One">3</option>
				<option value="One">4</option>
			</datalist></br>

			<label for="mobile_number">Mobile Number </label>
			<input type="number" id="mobile_number"></br>
			
			<label for="mail">Email id </label>
			<input type="email" id="mail"></br>
			
			<label for="feedback">Add your feedback </label>
			<textarea rows="5" cols="25"></textarea></br>




			</br>
			<input type="submit" value="Submit">
			<input type="reset" value="Reset"></br>


		</fieldset>
		
	</form>	
</body>

</html>
