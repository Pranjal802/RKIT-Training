<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let btn = document.getElementById(btn);
    btn.onclick(alert("You clicked me!!"));
</script>
<body>
    <div>
        <h1 draggable="true" ondrag="alert('Dont drag me')">Hello World</h1>
        <button id="btn" draggable>Click Me</button>
    </div>
</body>
</html>
