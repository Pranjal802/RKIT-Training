<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Demo</title>
    <style>
        .svg-bg{
            width: 100%;
            height: 1000px;
            background-image: url("./picture.jpg");
            background-size: cover; 
            background-repeat: repeat-x; 
        }
        .photo{
            padding: 20px;
        }
    </style>
</head>
<body>
    <h3>
        <ol type="I" start="2">
            <h4>Ways To Use SVG in HTML</h4>
            <li>&lt;svg&gt; - Inline SVG </li>
            <svg class="photo" viewBox="0 0 16 16" fill="none" width="200px" height="200px" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path fill-rule="evenodd" clip-rule="evenodd" d="M16 8C16 12.4183 12.4183 16 8 16C3.58172 16 0 12.4183 0 8C0 3.58172 3.58172 0 8 0C12.4183 0 16 3.58172 16 8ZM9.25 3.75C9.25 4.44036 8.69036 5 8 5C7.30964 5 6.75 4.44036 6.75 3.75C6.75 3.05964 7.30964 2.5 8 2.5C8.69036 2.5 9.25 3.05964 9.25 3.75ZM12 8H9.41901L11.2047 13H9.081L8 9.97321L6.91901 13H4.79528L6.581 8H4V6H12V8Z" fill="#000000"></path> </g></svg>
            <li> Using &lt;img&gt; tag</li>
            <img class="photo" src="./a-svgrepo-com.svg" width="200px" height="200px" alt="">
            <li>Using &lt;object&gt; tag</li>
            <object class="photo" data="./a-svgrepo-com.svg" type="image/svg+xml" width="200px" height="200px"></object>
            <li>Using &lt;embed&gt; tag</li>
            <embed class="photo" src="./a-svgrepo-com.svg" width="200px" height="200px">
            <li>Using &lt;iframe&gt;</li>
            <iframe src="./image_tag.html" sandbox="allow-forms" translate="no"></iframe>
            <li>Using &lt;picture&gt; tag</li>
            <picture class-="photo">
                <source srcset="./a-svgrepo-com.svg" width="200px" height="200px" type="image/svg+xml">
                <img src="./large.jpg" alt="">
            </picture>
            <li>Using CSS</li>
            <div class="svg-bg photo"></div>
            <li>
                <h2>Animated SVG</h2>
                <iframe src="./graduate.svg" type="image/svg+xml+css">
            </li>
        </ol>
    </h3>
</body>
</html>
